name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Silence the GitHub Actions Node.js 20 deprecation warning by opting in to Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stark-landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stark-landing/package-lock.json

      - run: npm ci

      - name: Build (static export)
        # NEXT_PUBLIC_BASE_PATH intentionally unset — serving from apex custom domain.
        run: npm run build

      - name: Add .nojekyll + CNAME (custom domain)
        run: |
          touch out/.nojekyll
          echo "starkfoundation.in" > out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stark-landing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
