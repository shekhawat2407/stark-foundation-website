<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distribution of stock outcomes">
  <rect width="700" height="440" fill="#141921"/>

  <text x="40" y="40" font-family="JetBrains Mono, monospace" font-size="10" fill="#8896ab" letter-spacing="1.5">29,078 STOCKS · LIFETIME RETURNS · 1925 TO 2023</text>

  <!-- Column 1: Negative returns (51.6%) -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="180" height="180" fill="#ef4444" opacity="0.85" rx="4"/>
    <text x="90" y="80" text-anchor="middle" font-family="serif" font-size="44" font-weight="500" fill="#faf8f3">51.6%</text>
    <text x="90" y="110" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#faf8f3" letter-spacing="1.2">NEGATIVE LIFETIME</text>
    <text x="90" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#faf8f3" letter-spacing="1.2">RETURN</text>

    <text x="0" y="210" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Lost money</text>
    <text x="0" y="230" font-family="sans-serif" font-size="11" fill="#8896ab">~15,000 stocks. The median</text>
    <text x="0" y="246" font-family="sans-serif" font-size="11" fill="#8896ab">stock fell 7.41% per year.</text>
  </g>

  <!-- Column 2: Beat T-bills but not extraordinary (~44%) -->
  <g transform="translate(250, 70)">
    <rect x="0" y="0" width="180" height="180" fill="#8896ab" opacity="0.4" rx="4"/>
    <text x="90" y="80" text-anchor="middle" font-family="serif" font-size="44" font-weight="500" fill="#faf8f3">~44%</text>
    <text x="90" y="110" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#faf8f3" letter-spacing="1.2">POSITIVE BUT NOT</text>
    <text x="90" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#faf8f3" letter-spacing="1.2">MARKET-MOVING</text>

    <text x="0" y="210" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Modest gains</text>
    <text x="0" y="230" font-family="sans-serif" font-size="11" fill="#8896ab">Roughly matched cash</text>
    <text x="0" y="246" font-family="sans-serif" font-size="11" fill="#8896ab">in aggregate.</text>
  </g>

  <!-- Column 3: The 4% -->
  <g transform="translate(460, 70)">
    <rect x="0" y="0" width="180" height="180" fill="#10b981" rx="4"/>
    <text x="90" y="80" text-anchor="middle" font-family="serif" font-size="44" font-weight="500" fill="#faf8f3">4%</text>
    <text x="90" y="110" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#faf8f3" letter-spacing="1.2">CREATED ALL NET</text>
    <text x="90" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#faf8f3" letter-spacing="1.2">WEALTH ABOVE T-BILLS</text>

    <rect x="55" y="145" width="70" height="24" fill="#3b82f6" rx="3"/>
    <text x="90" y="161" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#faf8f3" letter-spacing="1">TOP 86 = 50%</text>

    <text x="0" y="210" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">The wealth machine</text>
    <text x="0" y="230" font-family="sans-serif" font-size="11" fill="#8896ab">~1,160 stocks. The top 86</text>
    <text x="0" y="246" font-family="sans-serif" font-size="11" fill="#8896ab">alone created half the total.</text>
  </g>

  <line x1="40" y1="390" x2="660" y2="390" stroke="#e2e8f0" stroke-width="1" opacity="0.3"/>
  <text x="40" y="416" font-family="JetBrains Mono, monospace" font-size="9" fill="#8896ab" letter-spacing="0.5">The market's aggregate return masks a deeply skewed distribution of individual outcomes.</text>
</svg>
