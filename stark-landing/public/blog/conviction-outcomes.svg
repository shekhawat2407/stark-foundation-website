<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of dominant-narrative stocks">
  <rect width="700" height="460" fill="#141921"/>

  <text x="40" y="36" font-family="JetBrains Mono, monospace" font-size="10" fill="#8896ab" letter-spacing="1.5">"OBVIOUS" DOMINANT-PLAYER BETS · BY ERA</text>

  <text x="40" y="80" font-family="JetBrains Mono, monospace" font-size="9" fill="#8896ab" letter-spacing="1.2">COMPANY</text>
  <text x="200" y="80" font-family="JetBrains Mono, monospace" font-size="9" fill="#8896ab" letter-spacing="1.2">THE OBVIOUS THESIS</text>
  <text x="510" y="80" font-family="JetBrains Mono, monospace" font-size="9" fill="#8896ab" letter-spacing="1.2">OUTCOME</text>

  <line x1="40" y1="92" x2="660" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Cisco 1998 -->
  <g transform="translate(0, 110)">
    <text x="40" y="14" font-family="serif" font-size="18" font-weight="500" fill="#e2e8f0">Cisco</text>
    <text x="40" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#8896ab">1998</text>
    <text x="200" y="14" font-family="sans-serif" font-size="12" fill="#c8d0dc">Dominant infrastructure for the</text>
    <text x="200" y="30" font-family="sans-serif" font-size="12" fill="#c8d0dc">internet. Routers everywhere.</text>
    <text x="200" y="46" font-family="sans-serif" font-size="11" font-style="italic" fill="#8896ab">Briefly the world's most valuable company.</text>
    <text x="510" y="14" font-family="serif" font-size="16" fill="#ef4444" font-weight="500">~89% by 2002</text>
    <text x="510" y="32" font-family="sans-serif" font-size="11" fill="#8896ab">Took 25 years to recover.</text>
  </g>

  <line x1="40" y1="172" x2="660" y2="172" stroke="#1e2736" stroke-width="1"/>

  <!-- GE 2000 -->
  <g transform="translate(0, 188)">
    <text x="40" y="14" font-family="serif" font-size="18" font-weight="500" fill="#e2e8f0">GE</text>
    <text x="40" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#8896ab">2000</text>
    <text x="200" y="14" font-family="sans-serif" font-size="12" fill="#c8d0dc">Most admired company in America.</text>
    <text x="200" y="30" font-family="sans-serif" font-size="12" fill="#c8d0dc">Quality compounder par excellence.</text>
    <text x="200" y="46" font-family="sans-serif" font-size="11" font-style="italic" fill="#8896ab">Welch's GE. Six Sigma everything.</text>
    <text x="510" y="14" font-family="serif" font-size="16" fill="#ef4444" font-weight="500">~80% by 2018</text>
    <text x="510" y="32" font-family="sans-serif" font-size="11" fill="#8896ab">Broken into three pieces, 2024.</text>
  </g>

  <line x1="40" y1="250" x2="660" y2="250" stroke="#1e2736" stroke-width="1"/>

  <!-- Intel 2020 -->
  <g transform="translate(0, 266)">
    <text x="40" y="14" font-family="serif" font-size="18" font-weight="500" fill="#e2e8f0">Intel</text>
    <text x="40" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#8896ab">2020</text>
    <text x="200" y="14" font-family="sans-serif" font-size="12" fill="#c8d0dc">Unassailable share in the most</text>
    <text x="200" y="30" font-family="sans-serif" font-size="12" fill="#c8d0dc">important silicon category on Earth.</text>
    <text x="200" y="46" font-family="sans-serif" font-size="11" font-style="italic" fill="#8896ab">"Intel Inside." x86 forever.</text>
    <text x="510" y="14" font-family="serif" font-size="16" fill="#ef4444" font-weight="500">~70% peak to trough</text>
    <text x="510" y="32" font-family="sans-serif" font-size="11" fill="#8896ab">Lost AI race to NVDA.</text>
  </g>

  <line x1="40" y1="328" x2="660" y2="328" stroke="#1e2736" stroke-width="1"/>

  <!-- Peloton 2020 -->
  <g transform="translate(0, 344)">
    <text x="40" y="14" font-family="serif" font-size="18" font-weight="500" fill="#e2e8f0">Peloton</text>
    <text x="40" y="32" font-family="JetBrains Mono, monospace" font-size="10" fill="#8896ab">2020</text>
    <text x="200" y="14" font-family="sans-serif" font-size="12" fill="#c8d0dc">Obvious post-COVID secular trend.</text>
    <text x="200" y="30" font-family="sans-serif" font-size="12" fill="#c8d0dc">At-home fitness, network effects.</text>
    <text x="200" y="46" font-family="sans-serif" font-size="11" font-style="italic" fill="#8896ab">"This changes fitness forever."</text>
    <text x="510" y="14" font-family="serif" font-size="16" fill="#ef4444" font-weight="500">~97% from peak</text>
    <text x="510" y="32" font-family="sans-serif" font-size="11" fill="#8896ab">Catastrophic loss territory.</text>
  </g>

  <line x1="40" y1="406" x2="660" y2="406" stroke="#e2e8f0" stroke-width="1"/>

  <text x="40" y="430" font-family="sans-serif" font-style="italic" font-size="12" fill="#8896ab">Conviction is not edge. The same reasoning that picks NVDA picks each of these.</text>
</svg>
